<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnrollEase: THS - SHS</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="form.css" />

    <style>
      /* =====================================================
         REQUIRED FIELD ASTERISK
         ===================================================== */

      .required {
        color: #d93025;
        font-weight: 600;
        margin-left: 2px;
      }

      /* =====================================================
         INLINE VALIDATION
         ===================================================== */

      .field,
      .section-box {
        position: relative;
      }

      .field input.input-error,
      .field select.input-error,
      .section-box input.input-error,
      .section-box select.input-error {
        border: 1.5px solid #d93025 !important;
        background: #fff8f8 !important;
        box-shadow: 0 0 0 3px rgba(217, 48, 37, 0.08);
      }

      .field-error {
        display: none;
        margin-top: 6px;
        color: #d93025;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.4;
      }

      .has-error .field-error {
        display: block;
      }

      .field-error::before {
        content: "!";
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 15px;
        height: 15px;
        margin-right: 5px;
        border-radius: 50%;
        background: #d93025;
        color: white;
        font-size: 10px;
        font-weight: 700;
      }


/* =====================================================
   FLOATING HOME BUTTON
   ===================================================== */

.home-button {
  position: fixed;
  top: 24px;
  left: 30px;
  z-index: 9999;

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 11px 18px;

  background: #0a2a88;
  color: #ffffff;

  border: none;
  border-radius: 10px;

  text-decoration: none;
  font-family: "Poppins", sans-serif;
  font-size: 13px;
  font-weight: 600;

  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);

  transition:
    background 0.2s ease,
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.home-button:hover {
  background: #061f6b;
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
}

.home-button:active {
  transform: translateY(0);
}

.home-icon {
  font-size: 18px;
  line-height: 1;
}

/* Prevent the button from covering the form on smaller screens */
@media (max-width: 768px) {
  .home-button {
    top: 15px;
    right: 15px;
    padding: 9px 13px;
    font-size: 12px;
  }

  .home-icon {
    font-size: 16px;
  }
}

    </style>
  </head>

  <body>
    
  <!-- Floating Home Button -->
  <a href="index.html" class="home-button" aria-label="Go to Home">
    <span class="home-icon">⌂</span>
    <span>HOME</span>
  </a>
    

    <div class="form">
      <form id="enrollmentForm" novalidate>
        <h3>IF YOU HAVE NO INFORMATION, PLEASE TYPE N/A</h3>

        <!-- =====================================================
             BASIC INFORMATION
             ===================================================== -->

        <div class="row">
          <div class="field">
            <label>
              School Year
              <span class="required">*</span>
            </label>

            <select name="schoolYear" required>
              <option value="">Select</option>
              <option>2026 - 2027</option>
            </select>
          </div>

          <div class="field">
            <label>
              Grade Level to Enroll
              <span class="required">*</span>
            </label>

            <select name="gradeLevel" id="gradeLevel" required>
              <option value="">Select</option>
              <option>GRADE 11</option>
              <option>GRADE 12</option>
            </select>
          </div>

          <div class="field">
            <label>
              With LRN
              <span class="required">*</span>
            </label>

            <select name="with-lrn" required>
              <option value="">Select</option>
              <option>YES</option>
              <option>NO</option>
            </select>
          </div>

          <div class="field">
            <label>
              Balik-Aral/Transfer Student
              <span class="required">*</span>
            </label>

            <select name="balik-aral" required>
              <option value="">Select</option>
              <option>YES</option>
              <option>NO</option>
            </select>
          </div>
        </div>

        <!-- =====================================================
             LEARNER INFORMATION
             ===================================================== -->

        <h3>LEARNER INFORMATION</h3>

        <div class="row">
          <div class="field">
            <label>
              PSA NO.
              <span class="required">*</span>
            </label>

            <input type="text" name="psa" required />
          </div>

          <div class="field">
            <label>
              LRN
              <span
                class="required conditional-lrn-asterisk"
                style="display: none"
                >*</span
              >
            </label>

            <input
              type="text"
              name="lrn"
              maxlength="12"
              inputmode="numeric"
            />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>
              Last Name
              <span class="required">*</span>
            </label>

            <input type="text" name="lastName" required />
          </div>

          <div class="field">
            <label>
              First Name
              <span class="required">*</span>
            </label>

            <input type="text" name="firstName" required />
          </div>

          <div class="field">
            <label>Middle Name</label>
            <input type="text" name="middleName" />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Extension</label>
            <input type="text" name="extension" />
          </div>

          <div class="field">
            <label>
              Birthdate
              <span class="required">*</span>
            </label>

            <input
              type="text"
              name="birthdate"
              placeholder="MM/DD/YYYY"
              maxlength="10"
              required
            />
          </div>

          <div class="field">
            <label>
              Sex
              <span class="required">*</span>
            </label>

            <select name="sex" required>
              <option value="">Select</option>
              <option>MALE</option>
              <option>FEMALE</option>
            </select>
          </div>

          <div class="field">
            <label>Age</label>
            <input type="number" name="age" readonly />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>
              Place of Birth
              <span class="required">*</span>
            </label>

            <input
              type="text"
              name="placeOfBirth"
              placeholder="Municipality/City, Province"
              required
            />
          </div>

          <div class="field">
            <label>
              Religion
              <span class="required">*</span>
            </label>

            <input type="text" name="religion" required />
          </div>

          <div class="field">
            <label>
              Mother Tongue
              <span class="required">*</span>
            </label>

            <input type="text" name="motherTongue" required />
          </div>
        </div>

        <!-- =====================================================
             CURRENT ADDRESS
             ===================================================== -->

        <h3>CURRENT ADDRESS</h3>

        <div class="address-grid">
          <div class="field">
            <label>
              House NO.
              <span class="required">*</span>
            </label>

            <input type="text" name="currenthouseNO" required />
          </div>

          <div class="field wide">
            <label>
              Street
              <span class="required">*</span>
            </label>

            <input type="text" name="currentstreet" required />
          </div>

          <div class="field">
            <label>
              Barangay
              <span class="required">*</span>
            </label>

            <input type="text" name="currentbarangay" required />
          </div>

          <div class="field">
            <label>
              Municipality/City
              <span class="required">*</span>
            </label>

            <input
              type="text"
              name="currentmunicipalitycity"
              required
            />
          </div>

          <div class="field wide">
            <label>
              Province
              <span class="required">*</span>
            </label>

            <input type="text" name="currentprovince" required />
          </div>

          <div class="field">
            <label>
              Zip Code
              <span class="required">*</span>
            </label>

            <input
              type="text"
              name="currentzipCode"
              maxlength="4"
              inputmode="numeric"
              required
            />
          </div>
        </div>

        <!-- =====================================================
             PERMANENT ADDRESS
             ===================================================== -->

        <h3>PERMANENT ADDRESS</h3>

        <div class="section-box">
          <label>
            Same As Your Current Address
            <span class="required">*</span>
          </label>

          <select name="sameaddress" required>
            <option value="">Select</option>
            <option>YES</option>
            <option>NO</option>
          </select>
        </div>

        <div class="address-grid">
          <div class="field">
            <label>
              House NO.
              <span class="required permanent-required">*</span>
            </label>

            <input type="text" name="permanenthouseNO" />
          </div>

          <div class="field wide">
            <label>
              Street
              <span class="required permanent-required">*</span>
            </label>

            <input type="text" name="permanentstreet" />
          </div>

          <div class="field">
            <label>
              Barangay
              <span class="required permanent-required">*</span>
            </label>

            <input type="text" name="permanentbarangay" />
          </div>

          <div class="field">
            <label>
              Municipality/City
              <span class="required permanent-required">*</span>
            </label>

            <input type="text" name="permanentcity" />
          </div>

          <div class="field wide">
            <label>
              Province
              <span class="required permanent-required">*</span>
            </label>

            <input type="text" name="permanentprovince" />
          </div>

          <div class="field">
            <label>
              Zip Code
              <span class="required permanent-required">*</span>
            </label>

            <input
              type="text"
              name="permanentzipCode"
              maxlength="4"
              inputmode="numeric"
            />
          </div>
        </div>

        <!-- =====================================================
             PARENT/GUARDIAN INFORMATION
             ===================================================== -->

        <h3>PARENT/GUARDIAN INFORMATION</h3>

        <div class="row">
          <div class="field">
            <label>
              Father's Name
              <span class="required">*</span>
            </label>

            <input
              type="text"
              name="fatherName"
              placeholder="First Name Middle Name, Last Name"
              required
            />
          </div>

          <div class="field">
            <label>
              Contact Number
              <span class="required">*</span>
            </label>

            <input
              type="text"
              name="fatherContact"
              maxlength="11"
              inputmode="numeric"
              required
            />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>
              Mother's Name
              <span class="required">*</span>
            </label>

            <input
              type="text"
              name="motherName"
              placeholder="First Name Middle Name, Last Name"
              required
            />
          </div>

          <div class="field">
            <label>
              Contact Number
              <span class="required">*</span>
            </label>

            <input
              type="text"
              name="motherContact"
              maxlength="11"
              inputmode="numeric"
              required
            />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>
              Guardian Name
              <span class="required">*</span>
            </label>

            <input
              type="text"
              name="guardianName"
              placeholder="First Name Middle Name, Last Name"
              required
            />
          </div>

          <div class="field">
            <label>
              Contact Number
              <span class="required">*</span>
            </label>

            <input
              type="text"
              name="guardianContact"
              maxlength="11"
              inputmode="numeric"
              required
            />
          </div>
        </div>

        <!-- =====================================================
             OPTIONAL INFORMATION
             ===================================================== -->

        <h3>OPTIONAL INFORMATION</h3>

        <div class="section-box">
          <label>
            Belonging to Indigenous People Community?
            <span class="required">*</span>
          </label>

          <select name="ip" required>
            <option value="">Select</option>
            <option>YES</option>
            <option>NO</option>
          </select>

          <br /><br />

          <label>
            Culture
            <span class="required culture-required" style="display: none"
              >*</span
            >
          </label>

          <input
            type="text"
            name="culture"
            placeholder="If YES, specify"
          />
        </div>

        <div class="section-box">
          <label>
            Learner with Disability?
            <span class="required">*</span>
          </label>

          <select name="disability" required>
            <option value="">Select</option>
            <option>YES</option>
            <option>NO</option>
          </select>

          <br /><br />

          <label>
            Disability Type
            <span
              class="required disability-required"
              style="display: none"
              >*</span
            >
          </label>

          <select name="disType">
            <option value="">Select Disability</option>
            <option>VISUAL IMPAIRMENT (BLIND)</option>
            <option>VISUAL IMPAIRMENT (LOW VISION DISORDER)</option>
            <option>HEARING IMPAIRMENT</option>
            <option>AUTISM SPECTRUM DISORDER</option>
            <option>SPEECH/LANGUAGE</option>
            <option>LEARNING DISABILITY</option>
            <option>EMOTIONAL-BEHAVIORAL DISORDER</option>
            <option>CEREBRAL PALSY DISORDER</option>
            <option>INTELLECTUAL DISABILITY</option>
            <option>ORTHOPEDIC/PHYSICAL HANDICAP</option>
            <option>
              SPECIAL HEALTH PROBLEM/CHRONIC DISEASE (CANCER)
            </option>
          </select>
        </div>

        <div class="section-box">
          <label>
            Are you a 4P's Community?
            <span class="required">*</span>
          </label>

          <select name="4Ps" required>
            <option value="">Select</option>
            <option>YES</option>
            <option>NO</option>
          </select>

          <br /><br />

          <label>
            4P's Household ID
            <span class="required houseid-required" style="display: none"
              >*</span
            >
          </label>

          <input
            type="text"
            name="HouseID"
            placeholder="4P's Household ID"
          />
        </div>

        <div class="section-box">
          <label>
            Other Learning Modalities
            <span class="required">*</span>
          </label>

          <select name="LearningModalities" required>
            <option value="">Select Modality</option>
            <option>MODULAR (PRINT)</option>
            <option>MODULAR (DIGITAL)</option>
            <option>ONLINE</option>
            <option>EDUCATIONAL TELEVISION</option>
            <option>RADIO-BASED INSTRUCTION</option>
            <option>HOMESCHOOLING</option>
            <option>BLENDED</option>
          </select>
        </div>

        <!-- =====================================================
             BALIK-ARAL / TRANSFER
             ===================================================== -->

        <h3>FOR SENIOR HIGH SCHOOL</h3>

        <div class="field">
          <label>
            Termination
            <span class="required">*</span>
          </label>

          <select name="termination" required>
            <option value="">Select Termination</option>
            <option>1ST TERMINATION</option>
            <option>2ND TERMINATION</option>
            <option>3RD TERMINATION</option>
          </select>
        </div>

        <div class="row">
          <div class="field">
            <label>
              Track
              <span class="required">*</span>
            </label>

            <select name="track" id="track" required disabled>
              <option value="">Select Track</option>
            </select>
          </div>

          <div class="field">
            <label id="clusterStrandLabel">
              Cluster/Strand
              <span class="required">*</span>
            </label>

            <select
              name="clusterStrand"
              id="clusterStrand"
              required
              disabled
            >
              <option value="">Select Cluster/Strand</option>
            </select>
          </div>
        </div>

        <h3>
          RETURNING STUDENT (BALIK-ARAL)/TRANSFER STUDENT INFORMATION
        </h3>

        <div class="row">
          <div class="field">
            <label>
              Last Grade Level to Enroll
              <span
                class="required returning-required"
                style="display: none"
                >*</span
              >
            </label>

            <input type="text" name="Lastgradelevel" />
          </div>

          <div class="field">
            <label>
              Last School Attended
              <span
                class="required returning-required"
                style="display: none"
                >*</span
              >
            </label>

            <input type="text" name="Lastschool" />
          </div>

          <div class="field">
            <label>
              Last School Year Completed
              <span
                class="required returning-required"
                style="display: none"
                >*</span
              >
            </label>

            <input type="text" name="Lastschoolyear" />
          </div>

          <div class="field">
            <label>
              School ID
              <span
                class="required returning-required"
                style="display: none"
                >*</span
              >
            </label>

            <input type="text" name="schoolid" />
          </div>
        </div>

        <!-- =====================================================
             ENROLL BUTTON
             ===================================================== -->

        <div style="text-align: center; margin-top: 20px">
          <button
            type="button"
            class="enroll-btn"
            id="enrollButton"
          >
            ENROLL
          </button>
        </div>
      </form>
    </div>

    <script>
      "use strict";

      // =====================================================
      // FIREBASE CONFIGURATION
      // =====================================================

      const FIREBASE_URL =
        "https://enrollease---enrollment-form-default-rtdb.asia-southeast1.firebasedatabase.app";

      const form = document.getElementById("enrollmentForm");
      const gradeLevel = document.getElementById("gradeLevel");
      const trackSelect = document.getElementById("track");
      const clusterStrandSelect =
        document.getElementById("clusterStrand");
      const clusterStrandLabel =
        document.getElementById("clusterStrandLabel");

      const birthdateInput =
        document.querySelector('[name="birthdate"]');

      const ageInput =
        document.querySelector('[name="age"]');

      const sameAddress =
        document.querySelector('[name="sameaddress"]');

      const enrollButton =
        document.getElementById("enrollButton");

      let isEnrolling = false;

      // =====================================================
      // SHS TRACK / CLUSTER / STRAND OPTIONS
      // =====================================================

      const shsOptions = {
        "GRADE 11": {
          ACADEMIC: [
            "HUMANITIES AND SOCIAL SCIENCES",
            "SCIENCE, TECHNOLOGY, ENGINEERING AND MATHEMATICS",
            "ACCOUNTANCY, BUSINESS AND MANAGEMENT",
          ],

          "TECH-PRO": [
            "INFORMATION AND COMMUNICATION TECHNOLOGY",
            "INDUSTRIAL TECHNOLOGY",
            "HOME ECONOMICS",
          ],
        },

        "GRADE 12": {
          ACADEMIC: [
            "HUMANITIES AND SOCIAL SCIENCES",
            "SCIENCE, TECHNOLOGY, ENGINEERING AND MATHEMATICS",
            "ACCOUNTANCY, BUSINESS AND MANAGEMENT",
            "GENERAL ACADEMIC STRAND",
          ],

          "TECHNOLOGICAL-VOCATIONAL LIVELIHOOD": [
            "COMPUTER PROGRAMMING",
            "CONSUMER ELECTRONICS",
            "HOME ECONOMICS",
          ],
        },
      };

      function populateSelect(
        select,
        placeholder,
        values
      ) {
        select.replaceChildren();

        const defaultOption =
          document.createElement("option");

        defaultOption.value = "";
        defaultOption.textContent = placeholder;

        select.appendChild(defaultOption);

        values.forEach((value) => {
          const option =
            document.createElement("option");

          option.value = value;
          option.textContent = value;

          select.appendChild(option);
        });
      }

      function updateSHSOptions() {
        const selectedGrade =
          gradeLevel.value;

        const options =
          shsOptions[selectedGrade];

        trackSelect.value = "";
        clusterStrandSelect.value = "";

        populateSelect(
          trackSelect,
          "Select Track",
          []
        );

        populateSelect(
          clusterStrandSelect,
          "Select Cluster/Strand",
          []
        );

        if (!options) {
          trackSelect.disabled = true;
          clusterStrandSelect.disabled = true;

          trackSelect.required = false;
          clusterStrandSelect.required = false;

          clusterStrandLabel.innerHTML =
            'Cluster/Strand <span class="required">*</span>';

          syncRequiredMarkers();

          return;
        }

        trackSelect.disabled = false;
        clusterStrandSelect.disabled = false;

        trackSelect.required = true;
        clusterStrandSelect.required = true;

        if (selectedGrade === "GRADE 11") {
          clusterStrandLabel.innerHTML =
            'Cluster <span class="required">*</span>';

          populateSelect(
            trackSelect,
            "Select Track",
            Object.keys(
              shsOptions["GRADE 11"]
            )
          );
        } else {
          clusterStrandLabel.innerHTML =
            'Strand <span class="required">*</span>';

          populateSelect(
            trackSelect,
            "Select Track",
            Object.keys(
              shsOptions["GRADE 12"]
            )
          );
        }

        syncRequiredMarkers();
      }

      function updateClustersAndStrands() {
        const selectedGrade =
          gradeLevel.value;

        const selectedTrack =
          trackSelect.value;

        const gradeOptions =
          shsOptions[selectedGrade];

        const choices =
          gradeOptions &&
          gradeOptions[selectedTrack]
            ? gradeOptions[selectedTrack]
            : [];

        const label =
          selectedGrade === "GRADE 11"
            ? "Cluster"
            : "Strand";

        clusterStrandLabel.innerHTML =
          label +
          ' <span class="required">*</span>';

        populateSelect(
          clusterStrandSelect,
          "Select " + label,
          choices
        );

        syncRequiredMarkers();
      }

      gradeLevel.addEventListener(
        "change",
        updateSHSOptions
      );

      trackSelect.addEventListener(
        "change",
        updateClustersAndStrands
      );

      // =====================================================
      // FIREBASE DATASET
      // =====================================================

      function getDatabaseName() {
        if (gradeLevel.value === "GRADE 11") {
          return "SHS-STUDENTS-GRADE-11";
        }

        if (gradeLevel.value === "GRADE 12") {
          return "SHS-STUDENTS-GRADE-12";
        }

        return null;
      }

      // =====================================================
      // BIRTHDATE
      // =====================================================

      birthdateInput.addEventListener(
        "input",
        function () {
          let value =
            this.value
              .replace(/\D/g, "")
              .substring(0, 8);

          if (value.length >= 5) {
            value =
              value.substring(0, 2) +
              "/" +
              value.substring(2, 4) +
              "/" +
              value.substring(4, 8);
          } else if (value.length >= 3) {
            value =
              value.substring(0, 2) +
              "/" +
              value.substring(2, 4);
          }

          this.value = value;

          updateBirthdateAndAge();

          if (this.value.trim()) {
            clearFieldError(this);
          }
        }
      );

      function updateBirthdateAndAge() {
        const match =
          birthdateInput.value.match(
            /^(\d{2})\/(\d{2})\/(\d{4})$/
          );

        if (!match) {
          ageInput.value = "";
          return;
        }

        const month =
          Number(match[1]);

        const day =
          Number(match[2]);

        const year =
          Number(match[3]);

        const birthDate =
          new Date(
            year,
            month - 1,
            day
          );

        const today =
          new Date();

        if (
          birthDate.getFullYear() !== year ||
          birthDate.getMonth() !== month - 1 ||
          birthDate.getDate() !== day ||
          birthDate > today
        ) {
          ageInput.value = "";
          return;
        }

        let age =
          today.getFullYear() -
          year;

        if (
          today.getMonth() <
            month - 1 ||
          (
            today.getMonth() ===
              month - 1 &&
            today.getDate() < day
          )
        ) {
          age--;
        }

        ageInput.value = age;
      }

      // =====================================================
      // ADDRESS COPYING
      // =====================================================

      const addressPairs = [
        [
          "currenthouseNO",
          "permanenthouseNO",
        ],
        [
          "currentstreet",
          "permanentstreet",
        ],
        [
          "currentbarangay",
          "permanentbarangay",
        ],
        [
          "currentmunicipalitycity",
          "permanentcity",
        ],
        [
          "currentprovince",
          "permanentprovince",
        ],
        [
          "currentzipCode",
          "permanentzipCode",
        ],
      ];

      function getField(name) {
        return document.querySelector(
          `[name="${name}"]`
        );
      }

      function copyPermanentAddress() {
        if (
          sameAddress.value !== "YES"
        ) {
          return;
        }

        addressPairs.forEach(
          ([
            currentName,
            permanentName,
          ]) => {
            getField(
              permanentName
            ).value =
              getField(
                currentName
              ).value;
          }
        );
      }

      sameAddress.addEventListener(
        "change",
        function () {
          if (
            this.value === "YES"
          ) {
            copyPermanentAddress();
          } else {
            addressPairs.forEach(
              ([
                ,
                permanentName,
              ]) => {
                getField(
                  permanentName
                ).value = "";
              }
            );
          }

          controlOptionalFields();
          syncRequiredMarkers();
        }
      );

      addressPairs.forEach(
        ([currentName]) => {
          getField(
            currentName
          ).addEventListener(
            "input",
            () => {
              if (
                sameAddress.value ===
                "YES"
              ) {
                copyPermanentAddress();
              }
            }
          );
        }
      );

      // =====================================================
      // CONDITIONAL FIELDS
      // =====================================================

      function setDisabledAndClear(
        field,
        disabled
      ) {
        field.disabled =
          disabled;

        if (disabled) {
          field.value = "";

          clearFieldError(
            field
          );
        }
      }

      function controlOptionalFields() {
        const withLRN =
          getField("with-lrn");

        const balikAral =
          getField("balik-aral");

        const ip =
          getField("ip");

        const disability =
          getField("disability");

        const fourPs =
          getField("4Ps");

        // LRN
        const lrnRequired =
          withLRN.value === "YES";

        setDisabledAndClear(
          getField("lrn"),
          withLRN.value === "NO"
        );

        getField("lrn").required =
          lrnRequired;

        const lrnAsterisk =
          document.querySelector(
            ".conditional-lrn-asterisk"
          );

        if (lrnAsterisk) {
          lrnAsterisk.style.display =
            lrnRequired
              ? "inline"
              : "none";
        }

        // Balik-Aral
        const returningRequired =
          balikAral.value === "YES";

        [
          "Lastgradelevel",
          "Lastschool",
          "Lastschoolyear",
          "schoolid",
        ].forEach(
          (name) => {
            const field =
              getField(name);

            setDisabledAndClear(
              field,
              !returningRequired
            );

            field.required =
              returningRequired;
          }
        );

        document
          .querySelectorAll(
            ".returning-required"
          )
          .forEach(
            (asterisk) => {
              asterisk.style.display =
                returningRequired
                  ? "inline"
                  : "none";
            }
          );

        // Indigenous People
        const cultureRequired =
          ip.value === "YES";

        setDisabledAndClear(
          getField("culture"),
          !cultureRequired
        );

        getField("culture").required =
          cultureRequired;

        document.querySelector(
          ".culture-required"
        ).style.display =
          cultureRequired
            ? "inline"
            : "none";

        // Disability
        const disabilityRequired =
          disability.value ===
          "YES";

        setDisabledAndClear(
          getField("disType"),
          !disabilityRequired
        );

        getField("disType").required =
          disabilityRequired;

        document.querySelector(
          ".disability-required"
        ).style.display =
          disabilityRequired
            ? "inline"
            : "none";

        // 4P's
        const houseRequired =
          fourPs.value === "YES";

        setDisabledAndClear(
          getField("HouseID"),
          !houseRequired
        );

        getField("HouseID").required =
          houseRequired;

        document.querySelector(
          ".houseid-required"
        ).style.display =
          houseRequired
            ? "inline"
            : "none";

        // Permanent Address
        const permanentRequired =
          sameAddress.value ===
          "NO";

        [
          "permanenthouseNO",
          "permanentstreet",
          "permanentbarangay",
          "permanentcity",
          "permanentprovince",
          "permanentzipCode",
        ].forEach(
          (name) => {
            const field =
              getField(name);

            field.required =
              permanentRequired;

            if (
              sameAddress.value ===
              "YES"
            ) {
              field.disabled =
                true;
            } else {
              field.disabled =
                false;
            }
          }
        );

        document
          .querySelectorAll(
            ".permanent-required"
          )
          .forEach(
            (asterisk) => {
              asterisk.style.display =
                permanentRequired
                  ? "inline"
                  : "none";
            }
          );

        syncRequiredMarkers();
      }

      [
        "with-lrn",
        "balik-aral",
        "ip",
        "disability",
        "4Ps",
      ].forEach(
        (name) => {
          getField(
            name
          ).addEventListener(
            "change",
            controlOptionalFields
          );
        }
      );

      // =====================================================
      // VALIDATION UI
      // =====================================================

      function getFieldContainer(
        field
      ) {
        return (
          field.closest(".field") ||
          field.closest(
            ".section-box"
          )
        );
      }

      function showFieldError(
        field,
        message
      ) {
        if (!field) {
          return;
        }

        const container =
          getFieldContainer(
            field
          );

        field.classList.add(
          "input-error"
        );

        if (!container) {
          return;
        }

        container.classList.add(
          "has-error"
        );

        let errorMessage =
          container.querySelector(
            ".field-error"
          );

        if (!errorMessage) {
          errorMessage =
            document.createElement(
              "div"
            );

          errorMessage.className =
            "field-error";

          container.appendChild(
            errorMessage
          );
        }

        errorMessage.textContent =
          message;
      }

      function clearFieldError(
        field
      ) {
        if (!field) {
          return;
        }

        const container =
          getFieldContainer(
            field
          );

        field.classList.remove(
          "input-error"
        );

        if (!container) {
          return;
        }

        container.classList.remove(
          "has-error"
        );

        const errorMessage =
          container.querySelector(
            ".field-error"
          );

        if (errorMessage) {
          errorMessage.remove();
        }
      }

      function clearAllErrors() {
        document
          .querySelectorAll(
            ".input-error"
          )
          .forEach(
            (field) => {
              clearFieldError(
                field
              );
            }
          );
      }

      function scrollToField(
        field
      ) {
        if (!field) {
          return;
        }

        setTimeout(() => {
          field.scrollIntoView({
            behavior: "smooth",
            block: "center",
          });

          setTimeout(() => {
            field.focus();
          }, 250);
        }, 50);
      }

      function validateRequiredFields(
        requiredFields
      ) {
        clearAllErrors();

        for (
          const [
            field,
            label,
          ] of requiredFields
        ) {
          if (!field) {
            continue;
          }

          if (field.disabled) {
            continue;
          }

          if (
            !field.value.trim()
          ) {
            showFieldError(
              field,
              "Please fill out this field."
            );

            scrollToField(
              field
            );

            return false;
          }
        }

        return true;
      }

      // =====================================================
      // AUTOMATIC ERROR REMOVAL
      // =====================================================

      document.addEventListener(
        "input",
        function (event) {
          const field =
            event.target;

          if (
            !field.matches(
              "input, textarea, select"
            )
          ) {
            return;
          }

          if (
            field.value.trim()
          ) {
            clearFieldError(
              field
            );
          }
        }
      );

      document.addEventListener(
        "change",
        function (event) {
          const field =
            event.target;

          if (
            !field.matches(
              "input, textarea, select"
            )
          ) {
            return;
          }

          if (
            field.value.trim()
          ) {
            clearFieldError(
              field
            );
          }
        }
      );

      // =====================================================
      // REQUIRED FIELD MARKERS
      // =====================================================

      function syncRequiredMarkers() {
        document
          .querySelectorAll(
            "input, select, textarea"
          )
          .forEach(
            (field) => {
              const container =
                field.closest(
                  ".field"
                ) ||
                field.closest(
                  ".section-box"
                );

              if (!container) {
                return;
              }

              const label =
                container.querySelector(
                  "label"
                );

              if (!label) {
                return;
              }

              // Don't automatically add asterisk
              // to special labels that already have one.
              if (
                label.querySelector(
                  ".required"
                )
              ) {
                return;
              }

              if (
                field.required &&
                !field.disabled
              ) {
                const asterisk =
                  document.createElement(
                    "span"
                  );

                asterisk.className =
                  "required";

                asterisk.textContent =
                  "*";

                label.appendChild(
                  asterisk
                );
              }
            }
          );
      }

      // =====================================================
      // BIRTHDATE VALIDATION
      // =====================================================

      function validateBirthdate() {
        const value =
          birthdateInput.value.trim();

        const match =
          value.match(
            /^(\d{2})\/(\d{2})\/(\d{4})$/
          );

        if (!match) {
          showFieldError(
            birthdateInput,
            "Please enter your birthdate in MM/DD/YYYY format."
          );

          scrollToField(
            birthdateInput
          );

          return false;
        }

        const month =
          Number(match[1]);

        const day =
          Number(match[2]);

        const year =
          Number(match[3]);

        const date =
          new Date(
            year,
            month - 1,
            day
          );

        if (
          date.getFullYear() !==
            year ||
          date.getMonth() !==
            month - 1 ||
          date.getDate() !==
            day ||
          date > new Date()
        ) {
          showFieldError(
            birthdateInput,
            "Please enter a valid birthdate."
          );

          scrollToField(
            birthdateInput
          );

          return false;
        }

        clearFieldError(
          birthdateInput
        );

        updateBirthdateAndAge();

        return true;
      }

      // =====================================================
      // DIGIT VALIDATION
      // =====================================================

      function validateDigits(
        field,
        label,
        length
      ) {
        const pattern =
          new RegExp(
            "^\\d{" +
              length +
              "}$"
          );

        if (
          !pattern.test(
            field.value.trim()
          )
        ) {
          showFieldError(
            field,
            `${label} must contain exactly ${length} digits.`
          );

          scrollToField(
            field
          );

          return false;
        }

        clearFieldError(
          field
        );

        return true;
      }

[

                    .value,
              },

            "3-CURRENT-ADDRESS":
              {
                "1-HOUSE-NO":
                  fields.currenthouseNO
                    .value,

                "2-STREET":
                  fields.currentstreet
                    .value,

                "3-BARANGAY":
                  fields.currentbarangay
                    .value,

                "4-CITY":
                  fields.currentmunicipalitycity
                    .value,

                "5-PROVINCE":
                  fields.currentprovince
                    .value,

                "6-ZIP-CODE":
                  fields.currentzipCode
                    .value,
              },

            "4-PERMANENT-ADDRESS":
              {
                "1-HOUSE-NO":
                  fields.permanenthouseNO
                    .value,

                "2-STREET":
                  fields.permanentstreet
                    .value,

                "3-BARANGAY":
                  fields.permanentbarangay
                    .value,

                "4-CITY":
                  fields.permanentcity
                    .value,

                "5-PROVINCE":
                  fields.permanentprovince
                    .value,

                "6-ZIP-CODE":
                  fields.permanentzipCode
                    .value,
              },

            "5-PARENTS":
              {
                "1-FATHER-NAME":
                  fields.fatherName
                    .value,

                "2-FATHER-CONTACT":
                  fields.fatherContact
                    .value,

                "3-MOTHER-NAME":
                  fields.motherName
                    .value,

                "4-MOTHER-CONTACT":
                  fields.motherContact
                    .value,

                "5-GUARDIAN-NAME":
                  fields.guardianName
                    .value,

                "6-GUARDIAN-CONTACT":
                  fields.guardianContact
                    .value,
              },

            "6-OPTIONAL":
              {
                "1-IP":
                  fields.ip.value,

                "2-CULTURE":
                  fields.culture
                    .value,

                "3-DISABILITY":
                  fields.disability
                    .value,

                "4-DISABILITY-TYPE":
                  fields.disType
                    .value,

                "5-4PS":
                  fields["4Ps"].value,

                "6-HOUSE-ID":
                  fields.HouseID
                    .value,

                "7-LEARNING-MODALITY":
                  fields.LearningModalities
                    .value,
              },

            "7-BALIK-ARAL-TRANSFER":
              {
                "1-LAST-GRADE-LEVEL":
                  fields.Lastgradelevel
                    .value,

                "2-LAST-SCHOOL":
                  fields.Lastschool
                    .value,

                "3-LAST-SCHOOL-YEAR":
                  fields.Lastschoolyear
                    .value,

                "4-SCHOOL-ID":
                  fields.schoolid
                    .value,
              },

            "8-TIME-STAMP":
              formattedDate,

            "9-REGISTRATION-ID":
              studentID,
          };

          // =================================================
          // SAVE TO FIREBASE
          // =================================================

          const saveResponse =
            await fetch(
              `${FIREBASE_URL}/${dataset}/${studentID}.json`,
              {
                method: "PUT",

                headers: {
                  "Content-Type":
                    "application/json",
                },

                body:
                  JSON.stringify(
                    studentData
                  ),
              }
            );

          if (
            !saveResponse.ok
          ) {
            throw new Error(
              "Failed to save SHS student enrollment."
            );
          }

          // =================================================
          // CONFIRM SAVED RECORD
          // =================================================

          const savedRecord =
            await saveResponse.json();

          if (
            !savedRecord ||
            savedRecord[
              "9-REGISTRATION-ID"
            ] !== studentID
          ) {
            throw new Error(
              "Firebase did not confirm the saved student record."
            );
          }

          // =================================================
          // SAVE LOCAL STORAGE
          // =================================================

          localStorage.setItem(
            "studentID",
            studentID
          );

          localStorage.setItem(
            "studentDatabase",
            dataset
          );

          // =================================================
          // SUCCESS
          // =================================================

          alert(
            "YOU REGISTERED SUCCESSFULLY!"
          );

          window.location.href =
            "./successfullshs.html";

        } catch (error) {
          console.error(
            "SHS Enrollment Error:",
            error
          );

          alert(
            "An error occurred while saving the enrollment. Please check your internet connection and try again."
          );

        } finally {
          isEnrolling = false;

          enrollButton.disabled =
            false;

          enrollButton.textContent =
            "ENROLL";
        }
      }

      // =====================================================
      // ENROLL BUTTON
      // =====================================================

      enrollButton.addEventListener(
        "click",
        goToSuccess
      );

      // =====================================================
      // INITIAL STATE
      // =====================================================

      updateSHSOptions();
      controlOptionalFields();
      updateBirthdateAndAge();
      syncRequiredMarkers();
    </script>
  </body>
</html>
